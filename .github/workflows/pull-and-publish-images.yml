---
name: Pull Third Party Containers, Scan, and Publish to GHCR
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 0'

jobs:
  pull-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
    env:
      GH_REPO: gsa-tts/terraform-cloudgov
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: ghcr.io/sartography/spiffworkflow-backend:v2.2.0
            short-name: spiffarena-backend
          - name: ghcr.io/sartography/spiffworkflow-frontend:v2.2.0
            short-name: spiffarena-frontend
          - name: ghcr.io/sartography/connector-proxy-demo:v2.2.0
            short-name: spiffarena-connector
          - name: ghcr.io/gsa-tts/clamav-rest/clamav:latest
            short-name: clamav-proxy-support
          - name: quay.io/keycloak/keycloak:26.7.2
            short-name: keycloak-server


    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Trivy scans the amd64 variant locally — pull is fine for scanning,
      # it just must NOT be the thing we push.
      - name: Pull Docker Image (for scanning only)
        run: docker pull ${{ matrix.image.name }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db,ghcr.io/aquasecurity/trivy-java-db
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true
          TRIVY_DISABLE_VEX_NOTICE: true
        with:
          image-ref: '${{ matrix.image.name }}'
          scan-type: 'image'
          hide-progress: true
          format: 'sarif'
          output: '${{ matrix.image.short-name }}-results.sarif'
          exit-code: 0
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'
          timeout: 15m0s
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: '${{ matrix.image.short-name }}-results.sarif'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy full multi-arch manifest to GHCR
        env:
          SRC: ${{ matrix.image.name }}
          DEST: ghcr.io/${{ env.GH_REPO }}/${{ matrix.image.short-name }}
        run: |
          set -euo pipefail
          date=$(date +%Y%m%d)
          # skopeo is preinstalled on ubuntu-latest runners.
          # --all copies EVERY arch in the source manifest list (amd64 + arm64 + ...).
          # It authenticates to ghcr.io using the docker login above (~/.docker/config.json).
          skopeo copy --all "docker://${SRC}" "docker://${DEST}:latest"
          skopeo copy --all "docker://${DEST}:latest" "docker://${DEST}:${date}"
